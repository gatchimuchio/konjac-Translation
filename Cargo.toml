[package]
name = "konjac-translation"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Local translation experience shell for Konjac Translation"
repository = "https://github.com/gatchimuchio/konjac-Translation"
authors = ["がっちむち♂ (gatchimuchio)"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
